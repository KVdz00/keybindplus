plugins {
    id "com.gradleup.shadow" version "9.3.0"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.minecraftforge:forge:${rootProject.property("forge_version")}"
    implementation "net.minecraftforge:fmlcore:${rootProject.property("forge_version")}"
    implementation "net.minecraftforge:fmlloader:${rootProject.property("forge_version")}"
    implementation "net.minecraftforge:javafmllanguage:${rootProject.property("forge_version")}"
    implementation "net.minecraftforge:eventbus:6.0.5"
    implementation "net.minecraftforge:forgespi:7.0.0"
    implementation "dev.architectury:architectury-forge:${rootProject.property("architectury_api_version")}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}
