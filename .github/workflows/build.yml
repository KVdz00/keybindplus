name: Build CI

on:
  push:
    branches: [ "main", "1.21.x", "1.20.x", "1.19.x", "1.18.x", "1.17.x", "1.8.9" ]
  pull_request:
    branches: [ "main", "1.21.x", "1.20.x", "1.19.x", "1.18.x", "1.17.x", "1.8.9" ]

jobs:
  build:
    name: Build Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Java Version
        id: java_detect
        run: |
          REF="${{ github.ref_name }}"
          if [ "$REF" = "main" ]; then
            echo "java_version=25" >> $GITHUB_OUTPUT
          elif [ "$REF" = "1.21.x" ]; then
            echo "java_version=21" >> $GITHUB_OUTPUT
          elif [ "$REF" = "1.8.9" ]; then
            echo "java_version=8" >> $GITHUB_OUTPUT
          else
            echo "java_version=17" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java_detect.outputs.java_version }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keybindplus-${{ github.ref_name }}
          path: |
            fabric/build/libs/*-fabric.jar
            neoforge/build/libs/*-neoforge.jar
            forge/build/libs/*-forge.jar
            build/libs/*-forge-1.8.9.jar
